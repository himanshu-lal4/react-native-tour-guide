name: Publish to npm

# Publishes @wrack/react-native-tour-guide with provenance (the "verified"
# badge on the npm page). Provenance can ONLY be generated from CI — a local
# `npm publish` will never produce one.
#
# Auth uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is needed.
# One-time setup on npmjs.com, under Settings → Trusted Publisher:
#   Publisher:   GitHub Actions
#   Repository:  himanshu-lal4/react-native-tour-guide
#   Workflow:    publish-npm.yml
#   Environment: (leave blank)
#
# Until Trusted Publisher is configured, this workflow fails at the publish
# step with an auth error — expected, not a bug in the workflow.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for provenance / trusted publishing

jobs:
  publish:
    name: Publish @wrack/react-native-tour-guide
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs npm >= 11.5.1, which is where OIDC landed.
      # Pinned to the 11.x line rather than @latest on purpose: npm 12 requires
      # Node ^22.22.2 || ^24.15.0 || >=26, which the runner's Node may trail,
      # so `npm@latest` fails the install outright with EBADENGINE and takes
      # the whole release with it (it did, for v2.0.0's first publish run).
      - name: Pin npm to a version that supports trusted publishing
        run: npm install -g npm@^11

      - name: Build package
        run: yarn build

      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
